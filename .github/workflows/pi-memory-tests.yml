name: Pi memory hunt tests
on:
  push:
    branches: [ntr-memory-probe]
    paths:
      - 'usum_pi_bot/**'
      - '.github/workflows/pi-memory-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r usum_pi_bot/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: usum_pi_bot
